# VISHWAKARMA runtime configuration.
# Model assignment and budgets are engineering decisions recorded in the ledger.
# Workspace paths are relative to this file, so the repository is portable.

org: VISHWAKARMA
version: 0.1.0

workspaces:
  vishwakarma: "."
  returnproof: "../returnproof"
  smoke: "fixtures/smoke"

model:
  default: deepseek-coder:6.7b          # specialist + CE + PA turns (sequential only)
  lightweight: qwen3:0.6b-q4_K_M        # smoke tests, cheap classification turns

limits:
  max_steps_per_run: 30
  max_revisions_per_task: 2
  max_retries_per_run: 2
  # Independent roadmap tasks may run concurrently when a per-task model
  # factory is supplied. The local 7B model is sequential-use, so the
  # repository default stays at 1; raise this for independent fast models.
  max_parallel_workers: 1

# Trusted quality gates, executed by the gate runner (never by agents).
# Commands run with cwd = the workspace root. Results are hash-stamped into
# the ledger; agents can only read them. {python} is the interpreter running
# Forge, so no platform-specific .venv/Scripts or .venv/bin path is needed.
gates:
  vishwakarma:
    - name: pytest
      command: "{python} -m pytest -q"
      workspace: vishwakarma
    - name: ruff
      command: "{python} -m ruff check ."
      workspace: vishwakarma
    - name: mypy
      command: "{python} -m mypy forge"
      workspace: vishwakarma
  smoke:
    - name: solution-gate
      command: >-
        {python} -c "import solution; assert solution.add(2,3)==5;
        assert solution.add(0,0)==0; print('gate-ok')"
      workspace: smoke
