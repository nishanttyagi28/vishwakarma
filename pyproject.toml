[project]
name = "vishwakarma"
version = "0.1.0"
description = "VISHWAKARMA - local AI engineering organisation (Forge runtime)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "httpx>=0.27",
]

[project.scripts]
forge = "forge.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "coverage>=7", "ruff>=0.6",
       "mypy>=1.10", "types-PyYAML"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["forge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: opt-in live Ollama smoke tests (set FORGE_LIVE_SMOKE=1 to enable)",
]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true

[tool.coverage.run]
source = ["forge"]
branch = false

[tool.coverage.report]
fail_under = 88
show_missing = true
skip_covered = true

[tool.ruff.lint.per-file-ignores]
# pytest fixture parameters intentionally shadow the imported `env` fixture
"tests/test_smoke_mission.py" = ["F811"]
"tests/test_trace.py" = ["F811"]
"tests/test_webui.py" = ["F811"]
"tests/test_usage.py" = ["F811"]
